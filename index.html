<style>
/* Layout: one phone-width column (sticky header, scrolling screen, bottom tab bar), centred and capped at 640px on wide screens.
   Palette: ink navy for text, Ashoka-style blue as the brand, saffron as the single accent, green/red only for semantic states.
   Type: Noto Sans + Noto Sans Devanagari (GIGW / UX4G standard) for text, Noto Sans Mono for every official figure. */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#E9EEF7; --ink:#0D1B33; --muted:#566480; --line:#D9E0EC;
  --brand:#1C3F94; --on-brand:#FFFFFF; --accent:#B85A00; --accent-soft:#FFEFD9;
  --good:#17724A; --bad:#B42318; --track:#E1E8F3; --prev:#9AA9C4; --focus:#1C3F94;
  --f-display:'Noto Sans','Noto Sans Devanagari',system-ui,sans-serif;
  --f-body:'Noto Sans','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'Noto Sans Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1220; --surface:#111C31; --surface-2:#182744; --ink:#E8EEF8; --muted:#9AA9C2; --line:#23314D;
    --brand:#8FB0FF; --on-brand:#0A1220; --accent:#FFA347; --accent-soft:#2B1D0B;
    --good:#4CC38A; --bad:#FF8A7A; --track:#1E2D4B; --prev:#5C6E91; --focus:#8FB0FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1220; --surface:#111C31; --surface-2:#182744; --ink:#E8EEF8; --muted:#9AA9C2; --line:#23314D;
  --brand:#8FB0FF; --on-brand:#0A1220; --accent:#FFA347; --accent-soft:#2B1D0B;
  --good:#4CC38A; --bad:#FF8A7A; --track:#1E2D4B; --prev:#5C6E91; --focus:#8FB0FF; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{width:100%;max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--brand)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand svg{flex:none;color:var(--brand)}
.mark{font-family:var(--f-display);font-weight:700;font-size:23px;letter-spacing:-.01em;line-height:1}
.mark b{color:var(--accent);font-weight:700}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(10,20,40,.18)}

/* screens */
main{padding-block:20px 120px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:31px;line-height:1.1;letter-spacing:-.015em}
h2{font-size:19px;line-height:1.2}
h3{font-size:15px}
.lede{color:var(--muted);margin:6px 0 0;max-width:46ch}
.kicker{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tile:hover{border-color:var(--brand)}
.tile .lbl{font-size:13px;color:var(--muted);font-weight:600}
.tile .big{font-family:var(--f-mono);font-weight:600;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .sub{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink);width:fit-content;max-width:100%}
.chip.acc{background:var(--accent-soft);color:var(--accent)}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .l{min-width:0}
.row .v{font-family:var(--f-mono);font-weight:600;font-size:18px;white-space:nowrap;font-variant-numeric:tabular-nums}
.row .v small{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted);margin-left:6px}

/* bars */
.bars{display:flex;flex-direction:column;gap:11px}
.brow{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.brow .bl{min-width:0;overflow-wrap:anywhere}
.brow .bv{font-family:var(--f-mono);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.btrack{position:relative;height:10px;border-radius:5px;background:var(--track);margin-top:5px}
.bfill{position:absolute;top:0;bottom:0;border-radius:5px;background:var(--brand)}
.bfill.neg{background:var(--bad)}
.mdl{display:inline-block;border:1px dashed var(--accent);color:var(--accent);border-radius:999px;padding:0 8px;font-size:11px;font-weight:700;letter-spacing:.02em;text-transform:none;vertical-align:middle}
.bfill.hl{background:var(--accent)}
.bprev{position:absolute;top:12px;height:3px;border-radius:2px;background:var(--prev)}
.bars.hasprev .btrack{margin-bottom:6px}
.bnote{font-size:12px;color:var(--muted)}

/* forms */
.field{display:flex;gap:8px}
input[type=text],input[type=number],textarea,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px}
textarea{resize:vertical;min-height:96px}
input::placeholder,textarea::placeholder{color:var(--muted)}
.btn{border:0;border-radius:12px;background:var(--brand);color:var(--on-brand);font-weight:700;padding:0 18px;min-height:48px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.small{min-height:40px;padding:0 14px;font-size:14px}
.field-col{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-size:14px;cursor:pointer;min-height:40px}
.chips button:hover{border-color:var(--brand)}

/* answer */
.ans .big{font-family:var(--f-mono);font-weight:600;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.ans .big small{font-size:22px;color:var(--muted);margin-left:2px}
.ans .head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ans p{margin:0}
.src{border-top:1px dashed var(--line);padding-top:10px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.src b{color:var(--ink)}
.verdict{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.2}
.verdict .dot{width:14px;height:14px;border-radius:50%;flex:none}
.v-ok .dot{background:var(--good)} .v-no .dot{background:var(--bad)} .v-na .dot{background:var(--prev)}
.v-ok{color:var(--good)} .v-no{color:var(--bad)} .v-na{color:var(--muted)}

/* prices */
.geo{align-self:flex-start}
.inputs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.inp label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;line-height:1.3;min-height:34px}
.inp input{min-height:44px;padding:9px 12px}
.pill-ex{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 12px;font-size:14px}
.empty{border:1px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted)}

/* tables / lists */
.dset{display:flex;flex-direction:column;gap:3px;padding:12px 0;border-top:1px solid var(--line)}
.dset:first-child{border-top:0;padding-top:0}
.dset h3{font-size:15px}
dl{margin:0}
dt{font-weight:700;margin-top:10px}
dd{margin:2px 0 0;color:var(--muted)}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(8,1fr);gap:0}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;padding:6px 1px;font-size:10.5px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.tabs button[aria-current="page"]{color:var(--brand)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
.tabs svg{width:22px;height:22px}
.linkbtn{all:unset;cursor:pointer;color:#fff;text-decoration:underline}
.linkbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.ol-chart{width:100%;height:auto;display:block}
/* loading skeleton, shown until the first live data check finishes */
.sk{background:linear-gradient(90deg,var(--surface-2) 25%,var(--track) 37%,var(--surface-2) 63%);background-size:400% 100%;border-radius:10px}
@media (prefers-reduced-motion:no-preference){.sk{animation:skx 1.4s ease infinite}}
@keyframes skx{0%{background-position:100% 50%}100%{background-position:0 50%}}
.sk{flex:none;max-width:100%}
.sk-wrap{display:flex;flex-direction:column;gap:18px;width:100%;min-width:0}
.sk-head{display:flex;flex-direction:column;gap:10px}
.sk-card{cursor:default;gap:9px}
.sk-card:hover{box-shadow:none;border-color:var(--line)}
.sk-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.sk-row:first-child{border-top:0}
.sk-big{min-height:300px;gap:14px}
.sk-bars{display:flex;flex-direction:column;gap:16px;margin-top:4px}
.sk-bar{display:flex;flex-direction:column;gap:7px}
@media (prefers-reduced-motion:no-preference){.card,.tile{transition:border-color .15s}}
/* state view: one blue ramp for magnitude (palest = lowest in light mode; reversed in dark mode so the lowest sits near the surface) */
:root{--h1:#cde2fb;--h2:#9ec5f4;--h3:#6da7ec;--h4:#3987e5;--h5:#256abf;--h6:#184f95;--h7:#0d366b;
  --ht1:#0b1b33;--ht2:#0b1b33;--ht3:#0b1b33;--ht4:#0b1b33;--ht5:#ffffff;--ht6:#ffffff;--ht7:#ffffff;--tl:rgba(13,27,51,.16)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--h1:#0d366b;--h2:#184f95;--h3:#256abf;--h4:#3987e5;--h5:#6da7ec;--h6:#9ec5f4;--h7:#cde2fb;
  --ht1:#ffffff;--ht2:#ffffff;--ht3:#ffffff;--ht4:#0a1220;--ht5:#0a1220;--ht6:#0a1220;--ht7:#0a1220;--tl:rgba(255,255,255,.18)}}
:root[data-theme="dark"]{--h1:#0d366b;--h2:#184f95;--h3:#256abf;--h4:#3987e5;--h5:#6da7ec;--h6:#9ec5f4;--h7:#cde2fb;
  --ht1:#ffffff;--ht2:#ffffff;--ht3:#ffffff;--ht4:#0a1220;--ht5:#0a1220;--ht6:#0a1220;--ht7:#0a1220;--tl:rgba(255,255,255,.18)}
.h1{background:var(--h1);color:var(--ht1)}.h2{background:var(--h2);color:var(--ht2)}.h3{background:var(--h3);color:var(--ht3)}.h4{background:var(--h4);color:var(--ht4)}
.h5{background:var(--h5);color:var(--ht5)}.h6{background:var(--h6);color:var(--ht6)}.h7{background:var(--h7);color:var(--ht7)}
.chips button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.tmap{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px}
.st{border:0;padding:0;margin:0;aspect-ratio:1/1;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;min-width:0;font-family:var(--f-body);box-shadow:inset 0 0 0 1px var(--tl)}
.st .sc{font-weight:700;font-size:clamp(10px,3vw,15px);line-height:1;letter-spacing:.02em}
.st .sv{font-family:var(--f-mono);font-weight:600;font-size:clamp(8.5px,2.4vw,12.5px);line-height:1;font-variant-numeric:tabular-nums}
.st-na{background-color:transparent;color:var(--muted);background-image:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 6px);box-shadow:inset 0 0 0 1px var(--line)}
.st.sel{outline:3px solid var(--accent);outline-offset:1px;position:relative;z-index:2}

.lg{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}

.sd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ================= Government portal shell (GIGW-style) ================= */
:root{--gov:#0B2A5B;--gov-2:#123A7A;--saffron:#FF9933;--igreen:#138808;--on-gov:#FFFFFF}
:root[data-theme="dark"]{--gov:#0B1A33;--gov-2:#13274A}
body{font-size:16px;letter-spacing:0}
h1{font-weight:700;font-size:29px;letter-spacing:-.01em}
h2,h3{font-weight:700}
.wide{max-width:1240px}
.skip{position:absolute;left:8px;top:-60px;background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:6px;z-index:60;font-weight:700}
.skip:focus{top:8px}
.chip.good{background:#E2F3EA;color:var(--good)}
.chip.bad{background:#FCE6E3;color:var(--bad)}
:root[data-theme="dark"] .chip.good{background:#123426}
:root[data-theme="dark"] .chip.bad{background:#3A1A17}
.top{position:sticky;top:0;background:var(--gov);color:var(--on-gov);box-shadow:0 2px 8px rgba(5,15,35,.18)}
.top .wrap{padding-block:12px}
.brand{gap:12px}
.brand .logo{flex:none;width:44px;height:44px}
.brand-txt{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.mark{font-family:var(--f-display);font-weight:800;font-size:23px;letter-spacing:.01em;color:#fff}
.mark b{color:var(--saffron)}
.mark .dev{font-weight:600;font-size:17px;color:#D6E0F5;margin-left:8px}
.tagline{font-size:12.5px;color:#C9D5EE;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shell{display:block;flex:1 0 auto}
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.foot{flex:none}

.htools #clk{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25;font-size:12px;color:#D6E0F5;white-space:nowrap;margin-right:4px}
.htools .fs,.htools .lang{display:inline-flex;border:1px solid rgba(255,255,255,.28);border-radius:7px;overflow:hidden}
.htools .fs button,.htools .lang button{border:0;background:transparent;color:#E6EDFA;padding:4px 10px;min-height:32px;font-size:13px;font-weight:700;cursor:pointer}
.htools .fs button+button,.htools .lang button+button{border-left:1px solid rgba(255,255,255,.28)}
.htools button[aria-pressed="true"]{background:#fff;color:var(--gov)}
.themebtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid rgba(255,255,255,.28);border-radius:7px;background:transparent;color:#fff;cursor:pointer}
.themebtn svg{width:17px;height:17px}
.htools button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.htools button:hover{background:rgba(255,255,255,.12)}
.htools button[aria-pressed="true"]:hover{background:#fff}
.side{display:none}
main{padding-block:22px 32px}
.card,.tile{border-radius:10px}
.tile:hover{border-color:var(--brand);box-shadow:0 2px 10px rgba(10,30,70,.10)}
.kicker{color:var(--gov-2)}
:root[data-theme="dark"] .kicker{color:var(--brand)}
.btn{border-radius:8px}
input[type=text],input[type=number],textarea,select{border-radius:8px}
/* footer */
.foot{background:var(--gov);color:#C9D5EE;font-size:13.5px;margin-top:8px;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
.foot .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;padding-block:26px 18px}
.foot h4{margin:0 0 8px;color:#fff;font-size:14px;letter-spacing:.02em}
.foot a{color:#fff}
.foot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.foot .legal{border-top:1px solid rgba(255,255,255,.14);padding-block:12px;font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
/* desktop: sidebar layout */
@media (max-width:860px){.htools #clk{display:none}}
@media (min-width:960px){
  .top .wrap,.foot .wrap{max-width:1240px}
  .shell{display:grid;width:100%;grid-template-columns:260px minmax(0,1fr);gap:28px;max-width:1240px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px))}
  .shell main.wrap{max-width:820px;margin:0;padding-left:0;padding-right:0;padding-block:26px 40px}
  .side{display:block;position:sticky;top:76px;align-self:start;padding-block:26px}
  .side nav{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .side .side-h{padding:12px 16px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--gov-2)}
  .side button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px;border-top:1px solid var(--line);font-weight:600;font-size:15px;color:var(--ink);border-left:4px solid transparent}
  .side button:first-of-type{border-top:0}
  .side button svg{width:20px;height:20px;color:var(--muted);flex:none}
  .side button:hover{background:var(--surface-2)}
  .side button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
  .side button[aria-current="page"]{background:var(--surface-2);border-left-color:var(--brand);color:var(--ink)}
  .side button[aria-current="page"] svg{color:var(--brand)}
  .side .status{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
  .side .status b{color:var(--ink)}
  .dot-live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:6px;vertical-align:middle}
  .dot-snap{background:var(--accent)}
  .tabs{display:none}
  .foot{padding-bottom:0}
  .tiles{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
}
@media (max-width:600px){
  .tagline{display:none}
  .mark .dev{display:none}
  .htools #clk,.htools .fs{display:none}
}

/* ------------------------------------------------------------------ reusable pieces */
function hbars(rows,opt){
  opt=opt||{};
  var vals=[];rows.forEach(function(r){vals.push(r.v);if(r.p!=null)vals.push(r.p);});
  var mn=Math.min.apply(null,vals.concat([0])),mx=Math.max.apply(null,vals.concat([0])),span=(mx-mn)||1,zero=(-mn/span)*100;
  var hasPrev=rows.some(function(r){return r.p!=null;});
  var out=rows.map(function(r){
    var w=Math.abs(r.v)/span*100,left=r.v>=0?zero:zero-w;
    var cls='bfill'+(r.v<0?' neg':'')+(r.hl?' hl':'');
    var prev='';
    if(r.p!=null){var pw=Math.abs(r.p)/span*100,pl=r.p>=0?zero:zero-pw;prev='<div class="bprev" style="left:'+pl.toFixed(2)+'%;width:'+pw.toFixed(2)+'%"></div>';}
    var lab=esc(r.l)+(r.p!=null?' <span class="bnote">('+esc(opt.prevLabel||'')+' '+fx(r.p,opt.d)+(opt.unit||'')+')</span>':'');
    return '<div><div class="brow"><span class="bl">'+lab+'</span><span class="bv">'+fx(r.v,opt.d)+(opt.unit||'')+'</span></div><div class="btrack"><div class="'+cls+'" style="left:'+left.toFixed(2)+'%;width:'+w.toFixed(2)+'%"></div>'+prev+'</div></div>';
  }).join('');
  return '<div class="bars'+(hasPrev?' hasprev':'')+'">'+out+'</div>';
}
function srcFoot(keys,extra){
  var h=keys.map(function(k){var s=SRC[k];
    return '<div><b>'+L('Source','स्रोत')+':</b> '+L('MoSPI','सांख्यिकी मंत्रालय (MoSPI)')+' · '+esc(T(s.name))+' · '+esc(T(s.period))+' · '+L('Released','जारी')+' '+fmtDate(s.rel)+' · '+esc(T(s.status))+' · <a href="'+s.url+'" target="_blank" rel="noopener">'+L('Open official release','आधिकारिक रिलीज़ खोलें')+' ↗</a></div>';
  }).join('');
  return '<div class="src">'+h+(extra?'<div>'+extra+'</div>':'')+''+keys.map(function(k){return '<div>'+provLine(k)+'</div>';}).join('')+'</div>';
}
function dirWord(cur,prev){return cur>prev?1:cur<prev?-1:0;}
function arrow(cur,prev,d,cmp){
  var df=r2(cur-prev);
  if(df===0)return L('unchanged vs ','कोई बदलाव नहीं, ')+cmp;
  return (df>0?'▲ ':'▼ ')+Math.abs(df).toFixed(d)+L(' pts vs ',' अंक, ')+cmp;
}

var ML_LABEL={cpi:['retail inflation','खुदरा महँगाई'],food:['food inflation','खाद्य महँगाई'],items:['which prices moved most','किन चीज़ों के दाम बदले'],gdp:['GDP growth','GDP वृद्धि'],iip:['industrial output','औद्योगिक उत्पादन'],jobs:['unemployment and jobs','बेरोज़गारी और रोज़गार'],women:['women in the workforce','श्रम बल में महिलाएँ'],peers:['similar states','मिलते-जुलते राज्य']};
var mlIdx=null;
function mlPredict(q){
  if(window.__noML)return null;
  var M=ML_INTENT;
  if(!mlIdx){mlIdx={};M.features.forEach(function(f,i){mlIdx[f]=i;});}
  var t=String(q||'').normalize('NFC').toLowerCase(),words=t.split(/[\s.,;:!?"'()\[\]{}\/\\|\-–—+*&^%$#@~`<>=_]+/).filter(Boolean),cnt={};
  function add(f){var i=mlIdx[f];if(i!==undefined)cnt[i]=(cnt[i]||0)+1;}
  words.forEach(function(w){add('w:'+w);var s=' '+w+' ';for(var n=2;n<=4;n++)for(var i=0;i+n<=s.length;i++)add(s.substr(i,n));});
  var ids=Object.keys(cnt),x={},nrm=0;
  ids.forEach(function(i){var v=(1+Math.log(cnt[i]))*M.idf[i];x[i]=v;nrm+=v*v;});
  if(!ids.length)return null;nrm=Math.sqrt(nrm);
  var sc=M.classes.map(function(c,ci){var a=M.intercept[ci];ids.forEach(function(i){a+=M.coef[ci][i]*x[i]/nrm;});return a;});
  var mx=Math.max.apply(null,sc),ex=sc.map(function(v){return Math.exp(v-mx);}),sum=ex.reduce(function(a,b){return a+b;},0),best=0;
  var pr=ex.map(function(v,i){v=v/sum;if(v>ex[best]/sum)best=i;return v;});
  return {cls:M.classes[best],p:pr[best],probs:pr};
}

/* keyword match: Latin keywords must start at a word boundary, so 'alu' (potato) does not match 'value' */
function kmatch(s,k){
  var i=s.indexOf(k);
  while(i>=0){
    if(!/^[a-z]/.test(k)||i===0||!/[a-z]/.test(s.charAt(i-1)))return true;
    i=s.indexOf(k,i+1);
  }
  return false;
}

var EXAMPLE={'01':9000,'02':0,'03':1500,'04':8000,'05':800,'06':1000,'07':3000,'08':700,'09':700,'10':2000,'11':1200,'13':1500};
function calcPrices(){
  var geo=state.geo,rows=DATA.cpi.div.map(function(d){return {d:d,s:+state.spend[d.c]||0,i:geo==='rural'?d.r:d.u};});
  var total=rows.reduce(function(a,r){return a+r.s;},0);
  if(total<=0)return null;
  /* strict year-on-year rate for the same goods: what this month's basket costs now against what it cost a year ago */
  var before=rows.reduce(function(a,r){return a+r.s/(1+r.i/100);},0);
  rows.forEach(function(r){r.base=r.s/(1+r.i/100);r.contrib=(r.s-r.base)/before*100;});
  return {rows:rows,total:total,pers:(total/before-1)*100,extra:total-before,before:before,off:DATA.cpi.headline[geo][0]};
}
function pricesResult(){
  var c=calcPrices();
  if(!c)return '<div class="empty">'+L('Enter what your household spends in a month, or load the example budget, to see your own inflation.','अपने घर का मासिक खर्च भरें या उदाहरण बजट लगाएँ, तब आपकी अपनी महँगाई दिखेगी।')+'</div>';
  var diff=r2(c.pers-c.off),place=placeName(state.geo);
  var contrib=c.rows.filter(function(r){return r.s>0;}).map(function(r){return {l:T({en:r.d.en,hi:r.d.hi}),v:r.contrib};}).sort(function(a,b){return b.v-a.v;}).slice(0,6);
  var body='<h3>'+L('What drives it in your budget (percentage points, adding up to your rate)','आपके बजट में क्या असर डाल रहा है (प्रतिशत अंक)')+'</h3>'+hbars(contrib,{d:2});
  var t=L('Your household\'s inflation is about '+fx(c.pers,2)+'%, which is '+(diff===0?'the same as':Math.abs(diff).toFixed(2)+' points '+(diff>0?'above':'below'))+' the official CPI figure for '+place+' ('+fx(c.off,2)+'%). Buying the same things as a year ago would cost you about '+inr(c.extra)+' more each month.',
          'आपके घर की महँगाई लगभग '+fx(c.pers,2)+'% है, जो '+place+' के आधिकारिक आँकड़े '+fx(c.off,2)+'% से '+(diff===0?'बराबर है':Math.abs(diff).toFixed(2)+' अंक '+(diff>0?'अधिक':'कम')+' है')+'। एक साल पहले जैसा सामान खरीदने पर आपको हर महीने लगभग '+inr(c.extra)+' ज़्यादा लगेंगे।');
  return '<article class="card ans"><div class="kicker">'+L('Your inflation','आपकी महँगाई')+' · '+place+'</div><div class="big">'+fx(c.pers,2)+'<small>%</small></div><p>'+t+'</p>'+body+
    '<p class="small muted">'+L('Method: each group’s spending this month is divided by (1 + its official '+PE('cd','full')+' price change) to get what the same goods cost a year ago. Your inflation is this month’s total over last year’s total, minus 1, and the extra cost is the difference. The bars add up to your rate. This is an estimate for your household, not an official statistic; the official CPI uses fixed national weights. Insurance and financial services (division 12) are not in the published table, so they are left out.','विधि: हर समूह के इस महीने के खर्च को (1 + उसके '+PH('cd','full')+' के आधिकारिक मूल्य परिवर्तन) से भाग देकर पता किया जाता है कि वही सामान एक साल पहले कितने का था। आपकी महँगाई = इस महीने का कुल खर्च ÷ पिछले साल का कुल, घटा 1; अतिरिक्त खर्च दोनों का अंतर है। बार मिलकर आपकी दर के बराबर होते हैं। यह आपके घर का अनुमान है, आधिकारिक आँकड़ा नहीं; आधिकारिक CPI तय राष्ट्रीय भार इस्तेमाल करता है। बीमा और वित्तीय सेवाएँ (प्रभाग 12) प्रकाशित तालिका में नहीं हैं, इसलिए शामिल नहीं हैं।')+'</p>'+srcFoot(['cpi'])+'</article>';

function stVal(ind,code,sec){var r=IND[ind].data[code];if(!r)return null;var v=r[SEC[sec]];return v==null?null:v;}
function stList(ind,sec){var out=[];STATES.forEach(function(s){var v=stVal(ind,s.c,sec);if(v!=null)out.push({c:s.c,v:v});});out.sort(function(a,b){return b.v-a.v;});return out;}
function stName(s,short){return state.lang==='hi'?(short&&s.hs?s.hs:s.hi):(short&&s.s?s.s:s.en);}
function heatIdx(v,mn,mx){if(mx===mn)return 3;return Math.max(0,Math.min(6,Math.round((v-mn)/(mx-mn)*6)));}
function rankOf(list,c){for(var i=0;i<list.length;i++)if(list[i].c===c)return i+1;return null;}
function secName(sec){return sec==='rural'?L('Rural areas','ग्रामीण क्षेत्र'):sec==='urban'?L('Urban areas','शहरी क्षेत्र'):L('Rural and urban combined','ग्रामीण और शहरी मिलाकर');}
function secShort(sec){return sec==='rural'?L('Rural','ग्रामीण'):sec==='urban'?L('Urban','शहरी'):L('Combined','कुल');}
function findState(s){
  var best=null,bl=0;
  STATES.forEach(function(st){
    [st.en.toLowerCase(),st.hi].concat(st.al||[]).forEach(function(t){
      var latin=/^[\x00-\x7f]+$/.test(t),hit;
      if(latin){hit=new RegExp('(^|[^a-z])'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^a-z])').test(s);}
      else{hit=s.indexOf(t)>=0;}
      if(hit&&t.length>bl){best=st;bl=t.length;}
    });
  });
  return best;
}
function stateText(ind,s,sec,v){
  var I=IND[ind],nm=stName(s),india=I.india[SEC[sec]],list=stList(ind,sec),rk=rankOf(list,s.c),df=r2(v-india);
  var cmpEn=df===0?'the same as India':Math.abs(df).toFixed(I.d)+' points '+(df>0?'above':'below')+' India ('+fx(india,I.d)+'%)';
  var cmpHi=df===0?'भारत के बराबर':'भारत ('+fx(india,I.d)+'%) से '+Math.abs(df).toFixed(I.d)+' अंक '+(df>0?'अधिक':'कम');
  return L(nm+': '+I.en.toLowerCase()+' was '+fx(v,I.d)+'% ('+secName(sec).toLowerCase()+', '+I.per.en+'), '+cmpEn+'. Rank '+rk+' of '+list.length+' states and UTs, where 1 is the highest.',
           nm+' में '+I.hi+' '+fx(v,I.d)+'% रही ('+secName(sec)+', '+I.per.hi+'), जो '+cmpHi+' है। '+list.length+' राज्यों और केंद्र शासित प्रदेशों में क्रम '+rk+' (1 सबसे ऊँचा)।');
}
function stateBars(ind,s,sec){
  var I=IND[ind],rows=[];
  ['rural','urban','all'].forEach(function(k){var v=stVal(ind,s.c,k);if(v!=null)rows.push({l:secShort(k),v:v,p:I.india[SEC[k]],hl:k===sec});});
  return hbars(rows,{d:I.d,unit:'%',prevLabel:L('India','भारत')});
}
function ansState(d){

    pre='<article class="card"><div class="verdict v-na"><span class="dot"></span>'+L('Not in the quarterly PLFS tables','तिमाही PLFS तालिकाओं में नहीं')+'</div><p>'+L(nm+' is not one of the '+PQN()+' states and UTs in the PLFS quarterly bulletin, so retail inflation is shown instead.',nm+' PLFS तिमाही बुलेटिन के '+PQN()+' राज्यों और केंद्र शासित प्रदेशों में नहीं है, इसलिए खुदरा महँगाई दिखाई गई है।')+'</p></article>';
    ind='cpi';

    if(d.unemp&&ind==='lfpr')note+='<p class="small muted">'+L('The state-wise unemployment rate is not in this snapshot yet, so labour force participation is shown.','राज्यवार बेरोज़गारी दर इस स्नैपशॉट में अभी नहीं है, इसलिए श्रम बल भागीदारी दिखाई गई है।')+'</p>';
    if(d.food&&ind==='cpi')note+='<p class="small muted">'+L('State-wise food inflation is not in this snapshot, so overall retail inflation is shown.','राज्यवार खाद्य महँगाई इस स्नैपशॉट में नहीं है, इसलिए कुल खुदरा महँगाई दिखाई गई है।')+'</p>';
  }

  return pre+'<article class="card ans"><div class="kicker">'+esc(L(I.en,I.hi))+' · '+esc(nm)+'</div><div class="big">'+fx(v,I.d)+'<small>%</small></div><p>'+stateText(ind,s,sec,v)+'</p>'+note+
    '<h3>'+L(nm+' compared with India','भारत की तुलना में '+nm)+'</h3>'+stateBars(ind,s,sec)+
    '<div><button class="btn ghost small" data-act="openst" data-v="'+s.c+'" data-i="'+ind+'" data-s="'+sec+'">'+L('Open on the state map','राज्य मानचित्र पर खोलें')+'</button></div>'+srcFoot([I.src],extra)+'</article>';
}
function tileMap(ind,sec){
  var I=IND[ind],list=stList(ind,sec),mn=list[list.length-1].v,mx=list[0].v;
  return STATES.map(function(s){
    var v=stVal(ind,s.c,sec),sel=state.stSel===s.c,nm=stName(s),pos='grid-column:'+(s.x+1)+';grid-row:'+(s.y+1);
    if(v==null)return '<button class="st st-na'+(sel?' sel':'')+'" style="'+pos+'" data-act="stsel" data-v="'+s.c+'" title="'+esc(nm+': '+L('no data','आँकड़ा नहीं'))+'" aria-label="'+esc(nm+', '+L('no data in this release','इस रिलीज़ में आँकड़ा नहीं'))+'"><span class="sc">'+s.c+'</span><span class="sv">–</span></button>';
    return '<button class="st h'+(heatIdx(v,mn,mx)+1)+(sel?' sel':'')+'" style="'+pos+'" data-act="stsel" data-v="'+s.c+'" title="'+esc(nm+': '+fx(v,I.d)+'%')+'" aria-label="'+esc(nm+', '+fx(v,I.d)+'%')+'"><span class="sc">'+s.c+'</span><span class="sv">'+fx(v,I.d)+'</span></button>';
  }).join('');
}
function legendHtml(ind,sec){
  var I=IND[ind],list=stList(ind,sec),mn=list[list.length-1].v,mx=list[0].v,india=I.india[SEC[sec]];
  var tick=mx===mn?50:Math.max(0,Math.min(100,(india-mn)/(mx-mn)*100));
  return '<div class="lg"><span>'+fx(mn,I.d)+'</span><div class="lgwrap"><i class="lgtick" style="left:'+tick.toFixed(1)+'%"></i><div class="lgbar">'+[1,2,3,4,5,6,7].map(function(i){return '<i class="h'+i+'"></i>';}).join('')+'</div></div><span>'+fx(mx,I.d)+'</span></div>'+
    '<div class="small muted">▼ '+L('India','भारत')+' '+fx(india,I.d)+'% · <span class="nd"></span> '+L('no data','आँकड़ा नहीं')+'</div>';
}
function rankBars(ind,sec){

  }).join('')+'</div>';
}

  }).join('');

function matrixCard(sec){
  var cols=['cpi','lfpr','lfprF','wpr'],sc={};
  cols.forEach(function(k){var l=stList(k,sec);sc[k]=[l[l.length-1].v,l[0].v];});
  var key=state.mxSort,rows=STATES.slice(),loc=state.lang==='hi'?'hi':'en';
  rows.sort(function(a,b){
    if(key==='name')return stName(a,true).localeCompare(stName(b,true),loc);
    var va=stVal(key,a.c,sec),vb=stVal(key,b.c,sec);
    if(va==null&&vb==null)return stName(a,true).localeCompare(stName(b,true),loc);
    if(va==null)return 1;if(vb==null)return -1;return vb-va;
  });
  var labs={cpi:'CPI',lfpr:'LFPR',lfprF:L('Women','महिला'),wpr:'WPR'};
  var head='<thead><tr><th scope="col"><button data-act="mxsort" data-v="name" aria-pressed="'+(key==='name')+'">'+L('State','राज्य')+(key==='name'?' ▲':'')+'</button></th>'+cols.map(function(k){return '<th scope="col"><button data-act="mxsort" data-v="'+k+'" aria-pressed="'+(key===k)+'">'+labs[k]+(key===k?' ▼':'')+'</button></th>';}).join('')+'</tr></thead>';
  var body='<tbody>'+rows.map(function(s){
    var cells=cols.map(function(k){var v=stVal(k,s.c,sec);if(v==null)return '<td class="c"><span class="mna">–</span></td>';return '<td class="c"><span class="h'+(heatIdx(v,sc[k][0],sc[k][1])+1)+'">'+fx(v,IND[k].d)+'</span></td>';}).join('');
    return '<tr'+(state.stSel===s.c?' class="sel"':'')+'><td class="nm"><button data-act="stsel" data-v="'+s.c+'">'+esc(stName(s,true))+'</button></td>'+cells+'</tr>';
  }).join('')+'</tbody>';
  return '<section class="card"><div><h2>'+L('All indicators side by side','सभी संकेतक साथ-साथ')+'</h2><div class="small muted">'+secName(sec)+' · '+L('tap a column heading to sort','क्रम बदलने के लिए स्तंभ शीर्षक पर टैप करें')+'</div></div>'+
    '<div class="mxw"><table class="mx"><colgroup><col><col style="width:48px"><col style="width:48px"><col style="width:48px"><col style="width:48px"></colgroup>'+head+body+'</table></div>'+
    '<p class="small muted" style="margin:0">'+L('CPI is retail inflation ('+PE('cs','full')+'). LFPR is labour force participation, Women is the same for women, and WPR is the share of people working (all '+PE('q','qr')+'). Each column is shaded on its own scale, from its lowest to its highest value.','CPI खुदरा महँगाई है ('+PH('cs','full')+')। LFPR श्रम बल भागीदारी है, महिला उसी का महिलाओं का आँकड़ा है, और WPR काम करने वालों का हिस्सा है (सभी '+PH('q','qr')+')। हर स्तंभ अपने न्यूनतम से अधिकतम मान तक अलग पैमाने पर रंगा है।')+'</p>'+
    srcFoot(['cpi','plfsq'])+'</section>';
}

    seg+
    '<div class="pill-ex">'+L('The example budget is only a sample to try the tool. It is not an official figure. Replace it with your own numbers.','उदाहरण बजट केवल टूल आज़माने के लिए है, यह आधिकारिक आँकड़ा नहीं है। इसे अपनी संख्याओं से बदलें।')+'</div>'+
    '<div class="chips"><button data-act="example">'+L('Load example budget','उदाहरण बजट लगाएँ')+'</button><button data-act="clear">'+L('Clear','साफ़ करें')+'</button></div>'+
    '<section class="card"><h2>'+L('Monthly spending, in ₹','मासिक खर्च, ₹ में')+'</h2><div class="inputs">'+f+'</div></section>'+
    '<div id="pr-result" aria-live="polite">'+pricesResult()+'</div>';
}

  var up=UPCOMING.map(function(u){return '<div class="row"><span class="l">'+L(u.en,u.hi)+(u.noteEn?'<div class="small muted">'+L(u.noteEn,u.noteHi)+'</div>':'')+'</span><span class="v" style="font-size:15px">'+fmtDate(u.d)+'</span></div>';}).join('');
  var gl=[
    [L('Provisional / quick estimate','अनंतिम / त्वरित अनुमान'),L('A first figure that MoSPI may revise when more data comes in.','पहला आँकड़ा, जिसे अधिक आँकड़े आने पर MoSPI संशोधित कर सकता है।')],
    [L('Year on year','वार्षिक तुलना'),L('The change compared with the same month, or quarter, a year earlier.','एक साल पहले के उसी महीने या तिमाही की तुलना में बदलाव।')],
    [L('Percentage points','प्रतिशत अंक'),L('The gap between two percentages. Going from 4% to 5% is a rise of 1 point.','दो प्रतिशतों का अंतर। 4% से 5% होना 1 अंक की बढ़त है।')],
    [L('CPI','CPI'),L('Consumer Price Index. It tracks what households pay for a fixed basket of goods and services.','उपभोक्ता मूल्य सूचकांक। यह वस्तुओं और सेवाओं की तय टोकरी पर परिवारों के खर्च को मापता है।')],
    [L('Real vs nominal GDP','वास्तविक बनाम सांकेतिक GDP'),L('Real GDP removes the effect of price changes. Nominal GDP does not.','वास्तविक GDP में कीमतों के बदलाव का असर हटा दिया जाता है, सांकेतिक में नहीं।')],
    [L('Gross value added (GVA)','सकल मूल्य वर्धन (GVA)'),L('The value an industry adds: what it produces minus what it uses up. The industries\' GVA adds up to the whole economy\'s value added.','किसी उद्योग द्वारा जोड़ा गया मूल्य: जो वह बनाता है उसमें से जो खर्च होता है, घटाकर। सभी उद्योगों का GVA मिलकर पूरी अर्थव्यवस्था का मूल्य वर्धन बनता है।')],
    [L('IIP and industry groups','IIP और उद्योग समूह'),L('The Index of Industrial Production tracks factory, mining and power output. Manufacturing is split into 23 groups by the national industrial classification (NIC).','औद्योगिक उत्पादन सूचकांक कारखाने, खनन और बिजली के उत्पादन को मापता है। विनिर्माण को राष्ट्रीय औद्योगिक वर्गीकरण (NIC) के 23 समूहों में बाँटा गया है।')],
    [L('Model output','मॉडल आउटपुट'),L('Anything marked Model comes from a statistical model run on official figures. It is not an official statistic.','जिस पर Model लिखा है वह आधिकारिक आँकड़ों पर चले सांख्यिकीय मॉडल से आता है। यह आधिकारिक आँकड़ा नहीं है।')],
    [L('Unemployment rate / LFPR / WPR','बेरोज़गारी दर / LFPR / WPR'),L('Jobless share of the labour force / share of people working or seeking work / share of people working.','श्रम बल में बेरोज़गारों का हिस्सा / काम करने या ढूँढने वालों का हिस्सा / काम करने वालों का हिस्सा।')]
  ].map(function(g){return '<dt>'+g[0]+'</dt><dd>'+g[1]+'</dd>';}).join('');
  return '<section><div class="kicker">'+L('Sources and method','स्रोत और विधि')+'</div><h1>'+L('Where every number comes from','हर संख्या कहाँ से आती है')+'</h1></section>'+
    '<section class="card"><h2>'+L('Data in this app','इस ऐप में आँकड़े')+'</h2>'+ds+'<p class="small muted" style="margin:0">'+L('Figures were read from these releases on','आँकड़े इन रिलीज़ से पढ़े गए, तारीख:')+' '+fmtDate(SNAP)+'. '+L('Please verify against the linked release before quoting.','उद्धृत करने से पहले जुड़ी रिलीज़ से मिलान कर लें।')+'</p></section>'+
    '<section class="card"><h2>'+L('State coverage','राज्यवार कवरेज')+'</h2><ul class="plain"><li>'+L('Retail inflation covers all 36 states and UTs. Chandigarh has no rural market, so it has no rural figure.','खुदरा महँगाई सभी 36 राज्यों और केंद्र शासित प्रदेशों के लिए है। चंडीगढ़ में ग्रामीण बाज़ार नहीं है, इसलिए वहाँ ग्रामीण आँकड़ा नहीं है।')+'</li><li>'+L('Labour force participation and worker ratios come from the PLFS quarterly bulletin, which publishes '+PQN()+' states and UTs. The rest show as no data.','श्रम बल भागीदारी और कार्यकर्ता अनुपात PLFS तिमाही बुलेटिन से हैं, जिसमें '+PQN()+' राज्य और केंद्र शासित प्रदेश हैं। बाकी में आँकड़ा नहीं दिखता।')+'</li><li>'+L('State-wise unemployment rates are in Table 5 of that bulletin. They are not in this snapshot yet, because that table could not be read.','राज्यवार बेरोज़गारी दर उस बुलेटिन की तालिका 5 में है। वह इस स्नैपशॉट में अभी नहीं है, क्योंकि वह तालिका पढ़ी नहीं जा सकी।')+'</li><li>'+L('The PLFS state tables were read from the bulletin text and their column layout was matched to the all-India row. Check them against the linked bulletin before quoting.','PLFS राज्य तालिकाएँ बुलेटिन के पाठ से पढ़ी गईं और उनके स्तंभों का मिलान अखिल भारत पंक्ति से किया गया। उद्धृत करने से पहले जुड़े बुलेटिन से जाँच लें।')+'</li></ul></section>'+
    '<section class="card"><h2>'+L('Coming up','आगामी रिलीज़')+'</h2><div class="rows">'+up+'</div><p class="small muted" style="margin:0">'+L('Dates are from MoSPI\'s advance release calendar 2026-27 (version updated 25 May 2026) and can change; holiday releases move to the next working day. Other releases are on the calendar.','तिथियाँ MoSPI के अग्रिम रिलीज़ कैलेंडर 2026-27 (25 मई 2026 का संस्करण) से हैं और बदल सकती हैं; अवकाश वाली रिलीज़ अगले कार्य दिवस पर आती हैं। अन्य रिलीज़ कैलेंडर पर हैं।')+'</p></section>'+
    '<section class="card"><h2>'+L('Models in AnKSetu','AnKSetu में मॉडल')+' <span class="mdl">'+L('Model','मॉडल')+'</span></h2><ul class="plain">'+
      '<li><b>'+L('Question model.','प्रश्न मॉडल।')+'</b> '+L('When the keyword rules cannot place a question, a small text classifier (trained on '+ML_INTENT.trained_on+' hand-written questions in English, Hindi and Hinglish) guesses the topic. It only picks which official figure to show; it never writes a number. Below '+Math.round(ML_TH*100)+'% confidence the app says there is no official figure.','जब कीवर्ड नियम किसी प्रश्न को नहीं पहचानते, तब एक छोटा टेक्स्ट क्लासिफ़ायर (अंग्रेज़ी, हिंदी और हिंग्लिश के '+ML_INTENT.trained_on+' हाथ से लिखे प्रश्नों पर प्रशिक्षित) विषय का अनुमान लगाता है। यह केवल चुनता है कि कौन सा आधिकारिक आँकड़ा दिखाना है; कोई संख्या नहीं लिखता। '+Math.round(ML_TH*100)+'% से कम भरोसे पर ऐप कहता है कि कोई आधिकारिक आँकड़ा नहीं है।')+'</li>'+
      '<li><b>'+L('Measured.','मापा गया।')+'</b> '+L('Question understanding was tested on 229 questions in English, Hindi and Hinglish, including 49 that should be refused (other countries, other years, forecasts, cities, topics not covered). On 83 fresh questions not used for tuning, 81 were right on the first run (97.6%) and 16 of 17 out-of-scope questions were refused correctly; the two misses were fixed afterwards. Caveat: the test questions were written by the builder, not collected from real users, so real-world accuracy will be lower. The Yes/No buttons under each answer log real use on this device so it can be measured.','समझ की जाँच अंग्रेज़ी, हिंदी और हिंग्लिश के 229 प्रश्नों पर हुई, जिनमें 49 ऐसे थे जिन्हें मना किया जाना चाहिए (दूसरे देश, दूसरे साल, पूर्वानुमान, शहर, शामिल न किए गए विषय)। ट्यूनिंग में इस्तेमाल न हुए 83 नए प्रश्नों में से 81 पहली बार में सही थे (97.6%) और 17 में से 16 दायरे से बाहर के प्रश्न सही तरह मना हुए; दो चूकें बाद में ठीक की गईं। सावधानी: परीक्षण प्रश्न बनाने वाले ने लिखे थे, असली उपयोगकर्ताओं से नहीं लिए गए, इसलिए वास्तविक सटीकता कम होगी। हर उत्तर के नीचे हाँ/नहीं बटन इस डिवाइस पर असली उपयोग दर्ज करते हैं ताकि इसे मापा जा सके।')+'</li>'+
      '<li><b>'+L('State peer groups.','राज्य समूह।')+'</b> '+L('States are grouped with k-means on standardised official figures (inflation for '+ML_PEERS.lenses.prices.n+' states and UTs; work indicators for '+ML_PEERS.lenses.labour.n+'). It is a statistical grouping, not an official classification.','राज्यों को मानकीकृत आधिकारिक आँकड़ों पर k-means से समूहों में बाँटा गया है ('+ML_PEERS.lenses.prices.n+' राज्य/केंद्र शासित प्रदेशों की महँगाई; '+ML_PEERS.lenses.labour.n+' के काम के संकेतक)। यह सांख्यिकीय समूहन है, आधिकारिक वर्गीकरण नहीं।')+'</li>'+
      '<li><b>'+L('Fact checks stay rule-based.','तथ्य जाँच नियम-आधारित रहती है।')+'</b> '+L('The Check screen never uses a model, so its verdicts compare your number only with official figures.','जाँच स्क्रीन कभी मॉडल का उपयोग नहीं करती, इसलिए उसके निष्कर्ष आपकी संख्या की तुलना केवल आधिकारिक आँकड़ों से करते हैं।')+'</li></ul></section>'+
    '<section class="card"><h2>'+L('Checks that prevent wrong answers','ग़लत उत्तर रोकने वाली जाँचें')+'</h2><ul class="plain">'+
      '<li>'+L('<b>Right place, right time.</b> Questions about another country, a year or month not in the snapshot, a city or district, or a forecast are not answered with a nearby 2026 number. The app says what it does not have and offers the latest figure as a separate step. A city question shows its state’s urban figure, labelled as such.','<b>सही जगह, सही समय।</b> दूसरे देश, स्नैपशॉट में न होने वाले साल या महीने, शहर या ज़िले, या पूर्वानुमान के प्रश्नों का उत्तर किसी पास की 2026 की संख्या से नहीं दिया जाता। ऐप बताता है कि क्या उसके पास नहीं है और ताज़ा आँकड़ा अलग कदम के रूप में पेश करता है। शहर के प्रश्न पर उसके राज्य का शहरी आँकड़ा, उसी नाम से, दिखता है।')+'</li>'+
      '<li>'+L('<b>Spelling.</b> A word one or two letters off a known term (for example “inflaton”, “keral”) is read as that term.','<b>वर्तनी।</b> किसी जाने-पहचाने शब्द से एक-दो अक्षर अलग शब्द को वही शब्द माना जाता है (जैसे “inflaton”, “keral”)।')+'</li>'+
      '<li>'+L('<b>Unsure.</b> When no single reading is clear, the app offers the likely readings to pick from instead of guessing.','<b>अनिश्चित होने पर।</b> जब कोई एक अर्थ साफ़ न हो, तो ऐप अनुमान लगाने के बजाय संभावित अर्थ चुनने के लिए देता है।')+'</li>'+
      '<li>'+L('<b>Fact check.</b> Years, quarters and dates in a claim are not mistaken for figures, and claims about other periods or places are not given a verdict. “Doubled” and “halved” are tested for items.','<b>तथ्य जाँच।</b> दावे में साल, तिमाही और तारीख़ों को आँकड़ा नहीं समझा जाता, और दूसरी अवधि या जगह के दावों पर कोई निष्कर्ष नहीं दिया जाता। वस्तुओं के लिए “दोगुना” और “आधा” जाँचे जाते हैं।')+'</li>'+

/* ------------------------------------------------------------------ OUTLOOK (ARIMA)
   OUTLOOK holds ARIMA(p,d,q) fits made offline from the annual series in the notes. Each fit uses its own past only,
   so the result is a statistical projection, not an official forecast. Central = point forecast; the 80% range
   bounds supply the optimistic and pessimistic cases (on the side that helps or hurts this indicator). Years are
   start years: 2026 = FY2026-27, 2030 = FY2030-31. */
var OUT_END=2030;
function olFY(y){return 'FY'+String((y+1)%100).padStart(2,'0');}
function olScen(k,sc){var o=OUTLOOK[k];if(sc==='central')return o.mean;var hi=(sc==='opt')===(o.good>0);return hi?o.hi80:o.lo80;}
function olScN(sc){return sc==='central'?L('Central','केंद्रीय'):sc==='opt'?L('Optimistic','आशावादी'):L('Pessimistic','निराशावादी');}
function olChart(k,sc){
  var o=OUTLOOK[k],W=640,H=250,pl=40,pr=12,pt=12,pb=26;
  var y0=o.first,n=o.actual.length,lastA=o.last,yE=OUT_END;
  var sx=function(y){return pl+(y-y0)/(yE-y0)*(W-pl-pr);};
  var all=o.actual.concat(o.lo80,o.hi80);
  var mn=Math.min.apply(null,all.concat([0])),mx=Math.max.apply(null,all.concat([0]));
  var pd=(mx-mn)*0.1||1;mn-=pd;mx+=pd;
  var sy=function(v){return pt+(mx-v)/(mx-mn)*(H-pt-pb);};
  var pts=function(xs,ys){return xs.map(function(x,i){return sx(x).toFixed(1)+','+sy(ys[i]).toFixed(1);}).join(' ');};
  var fxs=[lastA].concat(o.years),path=olScen(k,sc),last=o.actual[n-1];
  var hiS=[last].concat(o.hi80),loS=[last].concat(o.lo80),cen=[last].concat(o.mean),sel=[last].concat(path);
  var bandF=pts(fxs,hiS)+' '+fxs.map(function(x,j){var i=fxs.length-1-j;return sx(fxs[i]).toFixed(1)+','+sy(loS[i]).toFixed(1);}).reverse().join(' ');
  var s='<svg class="ol-chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(L('Chart of actual and projected values','वास्तविक और अनुमानित मानों का चार्ट'))+'">';
  for(var t=0;t<=4;t++){var v=mn+(mx-mn)*t/4,yy=sy(v).toFixed(1);
    s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+yy+'" y2="'+yy+'" style="stroke:var(--line)"/>';
    s+='<text x="'+(pl-6)+'" y="'+(+yy+4)+'" text-anchor="end" style="fill:var(--muted);font-size:11px;font-family:var(--f-mono)">'+fx(v,0)+'</text>';}
  if(mn<0&&mx>0){var zy=sy(0).toFixed(1);s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+zy+'" y2="'+zy+'" style="stroke:var(--muted);stroke-width:1"/>';}
  s+='<polygon points="'+bandF+'" style="fill:var(--brand);fill-opacity:.16"/>';
  s+='<polyline points="'+pts(fxs,cen)+'" style="fill:none;stroke:var(--brand);stroke-width:2;stroke-dasharray:5 4"/>';
  if(sc!=='central')s+='<polyline points="'+pts(fxs,sel)+'" style="fill:none;stroke:var(--accent);stroke-width:2.6"/>';
  s+='<polyline points="'+pts(o.actual.map(function(_,i){return y0+i;}),o.actual)+'" style="fill:none;stroke:var(--ink);stroke-width:2"/>';
  o.actual.forEach(function(v,i){s+='<circle cx="'+sx(y0+i).toFixed(1)+'" cy="'+sy(v).toFixed(1)+'" r="2.5" style="fill:var(--ink)"/>';});
  for(var y=y0;y<=yE;y++){s+='<text x="'+sx(y).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" style="fill:var(--muted);font-size:10.5px;font-family:var(--f-mono)">'+olFY(y)+'</text>';}
  return s+'</svg>';
}

/* ---- validators: ranges are wide enough for any real value and narrow enough to catch a unit or column slip */
var R_INFL=[-30,100],R_GRO=[-60,200],R_PCT=[0,100];
function num(x,r){return typeof x==='number'&&isFinite(x)&&x>=r[0]&&x<=r[1];}
function numN(x,r){return x===null||num(x,r);}
function pairOK(a,r,nul){return Array.isArray(a)&&a.length===2&&(nul?numN(a[0],r)&&numN(a[1],r):num(a[0],r)&&num(a[1],r));}

function need(c,m){if(!c)throw new Error(m);}
function isObj(o){return !!o&&typeof o==='object'&&!Array.isArray(o);}
function hasKey(o,k){return Object.prototype.hasOwnProperty.call(o,k);}
function exactKeys(o,keys,what){

function isDateS(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(new Date(s+'T00:00:00Z').getTime());}
function isYM(p){return isObj(p)&&Number.isInteger(p.y)&&p.y>=2024&&p.y<=2100&&Number.isInteger(p.m)&&p.m>=1&&p.m<=12;}
function isFQ(p){return isObj(p)&&Number.isInteger(p.fy)&&p.fy>=2024&&p.fy<=2100&&Number.isInteger(p.q)&&p.q>=1&&p.q<=4;}
function cmpYM(a,b){return (a.y-b.y)*12+(a.m-b.m);}
function cmpFQ(a,b){return (a.fy-b.fy)*4+(a.q-b.q);}
function isUrlS(s){return typeof s==='string'&&s.length<600&&/^https:\/\/([a-z0-9-]+\.)*(mospi\.gov\.in|pib\.gov\.in)\/[^\s"'<>]*$/i.test(s);}

function blockHead(b,name,kind,baseKey){
  need(isObj(b),name+': not an object');

  need(isDateS(b.asOf)&&b.asOf<=todayS(1),name+': bad asOf');
  need(isDateS(b.rel)&&b.rel<=todayS(1),name+': bad release date');
  need(isUrlS(b.url),name+': release link must be an https link on mospi.gov.in or pib.gov.in');
  if(kind==='m'){
    need(isYM(b.period),name+': bad period');
    need(cmpYM(b.period,nowYM())<=0,name+': period is in the future');
    need(cmpYM(b.period,BASE.PD[baseKey])>=0,name+': older than the embedded snapshot');

    need(isFQ(b.period),name+': bad period');

    var ns=BASE.INDUSTRY.iip.map(function(r){return r.n;});exactKeys(b.groups,ns,'iip.groups');

    need(isObj(b.total)&&pairOK(b.total.i,[10,1000])&&num(b.total.g,[-100,300]),'iip.total');P.groups=partPeriod(b,'groups','ig','m');
  }
  return {key:'iip',parts:P,apply:function(){
    PD.i=cl(b.period);DATA.iip.overall=cl(d.overall);DATA.iip.index=d.index;DATA.iip.indexYearAgo=d.indexYearAgo;
    DATA.iip.sectors.forEach(function(r){r.v=d.sectors[r.en];});DATA.iip.use.forEach(function(r){r.v=d.use[r.en];});
    if(P.groups){INDUSTRY.iip.forEach(function(r){var g=b.groups[r.n];r.i=cl(g.i);r.g=g.g;});INDUSTRY.iipTotal=cl(b.total);PD.ig=P.groups;}
  }};
}
function buildGdp(b){
  blockHead(b,'gdp','q','g');var d=b.data;need(isObj(d),'gdp: data');
  ['real','gva','nominal'].forEach(function(k){need(pairOK(d[k],R_GRO),'gdp.'+k);});need(num(d.level,[1,100000]),'gdp.level');
  var sn=baseNames(BASE.DATA.gdp.sectors);exactKeys(d.sectors,sn,'gdp.sectors');sn.forEach(function(k){need(pairOK(d.sectors[k],R_GRO),'gdp.sectors.'+k);});
  var P={};
  if(b.industry!==undefined){
    var ids=BASE.INDUSTRY.gva.map(function(r){return r.id;});exactKeys(b.industry,ids,'gdp.industry');
    ids.forEach(function(id){var o=b.industry[id];exactKeys(o,['l','g'],'gdp.industry.'+id);need(pairOK(o.l,[1,1e9])&&pairOK(o.g,R_GRO),'gdp.industry.'+id);});P.industry=partPeriod(b,'industry','gi','q');
  }
  return {key:'gdp',parts:P,apply:function(){
    PD.g=cl(b.period);['real','gva','nominal'].forEach(function(k){DATA.gdp[k]=cl(d[k]);});DATA.gdp.level=d.level;
    DATA.gdp.sectors.forEach(function(r){r.cur=d.sectors[r.en][0];r.prev=d.sectors[r.en][1];});
    if(P.industry){INDUSTRY.gva.forEach(function(r){var o=b.industry[r.id];r.l=cl(o.l);r.g=cl(o.g);});PD.gi=P.industry;}
  }};
}
function buildPlfs(b){
  blockHead(b,'plfs','m','p');var d=b.data;need(isObj(d),'plfs: data');
  ['ur','lfpr','wpr'].forEach(function(f){var ks=Object.keys(BASE.DATA.plfs[f]);exactKeys(d[f],ks,'plfs.'+f);
    ks.forEach(function(k){need(pairOK(d[f][k],f==='ur'?[0,60]:R_PCT,true),'plfs.'+f+'.'+k);});need(pairOK(d[f].all,f==='ur'?[0,60]:R_PCT),'plfs.'+f+'.all must be complete');});
  return {key:'plfs',parts:{},apply:function(){PD.p=cl(b.period);['ur','lfpr','wpr'].forEach(function(f){DATA.plfs[f]=cl(d[f]);});}};
}
function buildPlfsq(b){
  blockHead(b,'plfsq','q','q');
  var T3=['lfpr','lfprF','wpr'];need(isObj(b.states)&&isObj(b.india),'plfsq: shape');
  T3.forEach(function(t){
    need(isObj(b.states[t])&&tripOK(b.india[t],R_PCT),'plfsq.'+t);var n=0;
    Object.keys(b.states[t]).forEach(function(c){need(STATE_BY[c]&&tripOK(b.states[t][c],R_PCT),'plfsq.'+t+'.'+c);n++;});
    need(n>=15,'plfsq.'+t+': only '+n+' states');
  });
  return {key:'plfsq',parts:{},apply:function(){
    repl(LFPR_ST,cl(b.states.lfpr));repl(LFPRF_ST,cl(b.states.lfprF));repl(WPR_ST,cl(b.states.wpr));
    T3.forEach(function(t){IND[t].india=cl(b.india[t]);});PD.q=cl(b.period);STATE_READ.plfsq=b.asOf;
  }};
}
var BUILDERS={cpi:buildCpi,iip:buildIip,gdp:buildGdp,plfs:buildPlfs,plfsq:buildPlfsq};
/* peer groups are accepted only if they were computed from the very numbers now on screen */
function peersMatchTables(P){
  try{
    need(isObj(P)&&isObj(P.lenses)&&typeof P.method==='string','peers: shape');
    var specs={prices:function(c){return CPI_ST[c];},labour:function(c){return LFPR_ST[c]&&LFPRF_ST[c]&&WPR_ST[c]?[LFPR_ST[c][2],LFPRF_ST[c][2],WPR_ST[c][2]]:null;}};
    Object.keys(specs).forEach(function(key){
      var Lz=P.lenses[key];need(isObj(Lz)&&Number.isInteger(Lz.k)&&Lz.k>=2&&Lz.k<=5&&num(Lz.silhouette,[-1,1]),'peers.'+key);
      need(Array.isArray(Lz.groups)&&Lz.groups.length===Lz.k&&isObj(Lz.assign)&&isObj(Lz.features)&&isObj(Lz.neighbors),'peers.'+key+': shape');
      need(Array.isArray(Lz.names_en)&&Array.isArray(Lz.names_hi)&&Lz.names_en.length===Lz.names_hi.length&&Lz.names_en.length===3,'peers.'+key+': names');
      var inGroup={};Lz.groups.forEach(function(g,gi){need(g.id===gi+1&&Array.isArray(g.members)&&Array.isArray(g.means)&&g.means.length===3,'peers.'+key+': group');g.members.forEach(function(c){need(STATE_BY[c]&&!inGroup[c],'peers.'+key+': member '+c);inGroup[c]=gi+1;});});
      Object.keys(Lz.assign).forEach(function(c){need(STATE_BY[c],'peers.'+key+': code');need(Lz.assign[c]===null||Lz.assign[c]===inGroup[c],'peers.'+key+': assign/group mismatch '+c);});
      var cnt=0;Object.keys(Lz.features).forEach(function(c){
        var f=Lz.features[c],t=specs[key](c);need(Array.isArray(f)&&f.length===3&&t,'peers.'+key+': features '+c);
        for(var i=0;i<3;i++)need(t[i]!==null&&Math.abs(f[i]-t[i])<0.0051,'peers.'+key+': features differ from the tables for '+c);
        need(inGroup[c]&&Array.isArray(Lz.neighbors[c])&&Lz.neighbors[c].length>=1,'peers.'+key+': neighbours '+c);
        Lz.neighbors[c].forEach(function(p){need(Array.isArray(p)&&STATE_BY[p[0]]&&Lz.features[p[0]]&&num(p[1],[0,100]),'peers.'+key+': neighbour');});cnt++;
      });
      var expect=0;STATES.forEach(function(s){var t=specs[key](s.c);if(t&&t.every(function(x){return x!==null;}))expect++;});
      need(cnt===expect&&Lz.n===cnt,'peers.'+key+': covers '+cnt+' states but the tables have '+expect);
    });
    return true;
  }catch(e){LIVE.rejected.push({block:'peers',why:String(e.message||e)});return false;}
}
function validUpcoming(u){
  return Array.isArray(u)&&u.length<=60&&u.every(function(r){return isObj(r)&&typeof r.en==='string'&&typeof r.hi==='string'&&isDateS(r.d)&&r.en.length<=120&&r.hi.length<=160&&(r.noteEn===undefined||typeof r.noteEn==='string')&&(r.noteHi===undefined||typeof r.noteHi==='string');});
}
function applyLive(j){
  need(isObj(j)&&j.schema===1&&isObj(j.blocks),'data.json: unsupported format');
  need(typeof j.generated==='string'&&!isNaN(Date.parse(j.generated))&&Date.parse(j.generated)<=Date.now()+864e5,'data.json: bad generated time');
  var gen=new Date(j.generated).toISOString().slice(0,10);
  need(gen>=BASE.SNAP,'data.json: older than the snapshot built into the app');
  resetToBase();
  var plans=[];
  Object.keys(BUILDERS).forEach(function(k){
    if(j.blocks[k]===undefined)return;
    try{plans.push(BUILDERS[k](j.blocks[k]));}catch(e){LIVE.rejected.push({block:k,why:String(e.message||e)});}
  });
  Object.keys(j.blocks).forEach(function(k){if(!BUILDERS[k])LIVE.rejected.push({block:k,why:'unknown block ignored'});});
  plans.forEach(function(p){
    p.apply();var b=j.blocks[p.key];SRC[p.key].rel=b.rel;SRC[p.key].url=b.url;
    LIVE.blocks[p.key]={source:b.source,asOf:b.asOf,parts:Object.keys(p.parts)};LIVE.applied.push(p.key);
  });
  var statesChanged=cmpYM(PD.cs,BASE.PD.cs)!==0||cmpFQ(PD.q,BASE.PD.q)!==0;
  if(j.peers!==undefined&&peersMatchTables(j.peers)){ML_PEERS=cl(j.peers);PEERS_OK=true;}
  else if(statesChanged){PEERS_OK=false;}
  if(j.upcoming!==undefined){if(validUpcoming(j.upcoming))UPCOMING=cl(j.upcoming);else LIVE.rejected.push({block:'upcoming',why:'bad shape, calendar kept'});}
  SNAP=gen;LIVE.generated=j.generated;LIVE.status='live';
  syncSrc();
}
var liveTimer=null,lastSig='',lastFetch=0;
function afterApply(){
  if(state.askQ&&state.tab==='ask'){state.askHtml=answerFor(state.askQ)||'';}
  state.chkHtml='';
}
function fetchLive(force){
  if(typeof fetch!=='function')return Promise.resolve();
  lastFetch=Date.now();
  var ctl=typeof AbortController==='function'?new AbortController():null,to=setTimeout(function(){if(ctl)ctl.abort();},8000);
  return fetch(DATA_URL+(DATA_URL.indexOf('?')<0?'?':'&')+'t='+Date.now(),{cache:'no-store',signal:ctl?ctl.signal:undefined})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
    .then(function(txt){
      if(txt.length>4e6)throw new Error('data.json too large');
      if(!force&&txt.length+':'+txt.slice(0,200)===lastSig)return false;
      var j=JSON.parse(txt);applyLive(j);lastSig=txt.length+':'+txt.slice(0,200);LIVE.err='';LIVE.loadedAt=new Date().toISOString();return true;
    })
    .catch(function(e){LIVE.err=String(e&&e.message||e);if(LIVE.status==='live'){/* keep what was last applied */}return false;})
    .then(function(changed){
      clearTimeout(to);
      if(changed){afterApply();var ae=document.activeElement;
        if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName||'')){setTimeout(function(){render(true);},4000);}else render(true);}
      else if(state.tab==='sources')render(true);
    });
}
function clockTick(){var e=document.getElementById('clk');if(!e)return;var o={timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit',hour12:false};var now=new Date().toLocaleTimeString('en-IN',Object.assign({second:'2-digit'},o))+' IST';var chk=lastFetch?L('checked ','जाँचा ')+new Date(lastFetch).toLocaleTimeString('en-IN',o)+(LIVE.err?' ('+L('check failed','जाँच विफल')+')':''):L('not checked yet','अभी तक जाँच नहीं हुई');e.innerHTML='<span>'+now+'</span><span style="font-size:11px">'+chk+'</span>';}
function startLive(){
  clockTick();setInterval(clockTick,1000);
  var done=function(){if(!booting)return;booting=false;render(false);};
  Promise.resolve(fetchLive(true)).then(done,done);
  setTimeout(done,10000);
  if(typeof setInterval==='function')liveTimer=setInterval(function(){fetchLive(false);},300000);
  if(typeof document.addEventListener==='function')document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible'&&Date.now()-lastFetch>60000)fetchLive(false);});
}
function provLine(k){
  var b=LIVE.blocks[k];
  if(b&&b.source==='api')return L('Fetched automatically from the MoSPI API on ','MoSPI API से अपने-आप लाया गया: ')+fmtDate(b.asOf);
  if(b)return L('Verified snapshot, read from the release on ','सत्यापित स्नैपशॉट, रिलीज़ से पढ़ा गया: ')+fmtDate(b.asOf);
  return L('Verified snapshot, read from the release on ','सत्यापित स्नैपशॉट, रिलीज़ से पढ़ा गया: ')+fmtDate(k==='cpi'||k==='plfsq'?STATE_READ[k]:BASE.SNAP);
}

render(false);
startLive();
})();
